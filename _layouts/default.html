<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% if page.title %}{{ page.title }} — {% endif %}{{ site.title }}</title>
{% if page.description %}<meta name="description" content="{{ page.description | escape }}">{% endif %}
<script>
try { var t = localStorage.getItem("theme"); if (t) document.documentElement.setAttribute("data-theme", t); } catch (e) {}
</script>
<link rel="stylesheet" href="{{ '/assets/style.css' | relative_url }}">
</head>
<body>
<div class="wrap">
  <header class="site">
    <a class="name" href="{{ '/' | relative_url }}">{{ site.title }}</a>
    <nav>
      <a href="{{ '/' | relative_url }}">Статьи</a>
      <a href="{{ '/about/' | relative_url }}">Обо мне</a>
      <button class="theme" id="theme" type="button">тема</button>
    </nav>
  </header>

  {{ content }}

  <footer>{{ site.title }}</footer>
</div>
<script>
document.getElementById("theme").addEventListener("click", function () {
  var root = document.documentElement;
  var cur = root.getAttribute("data-theme") ||
    (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
  var next = cur === "dark" ? "light" : "dark";
  root.setAttribute("data-theme", next);
  try { localStorage.setItem("theme", next); } catch (e) {}
});
</script>
</body>
</html>
